<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <meta name="description" content="StockMain é um sistema de gestão de estoque para organizar produtos, movimentações e informações em um só lugar." />
    <title>StockMain | Gestão de Estoque</title>
    <style>
      #stockmain-boot-fallback {
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center;
        padding: 24px; background: #f5f7fc; color: #26334b;
        font-family: Arial, sans-serif; text-align: center;
      }
      #stockmain-boot-fallback section {
        width: min(100%, 520px); padding: 28px; border: 1px solid #e8ecf4;
        border-radius: 16px; background: #fff; box-shadow: 0 20px 60px rgba(32,45,79,.1);
      }
      #stockmain-boot-fallback strong { font-size: 22px; }
      #stockmain-boot-fallback p { color: #667287; line-height: 1.6; }
      #stockmain-boot-fallback pre {
        overflow-wrap: anywhere; white-space: pre-wrap; padding: 12px;
        border-radius: 8px; background: #f5f7fc; color: #9f3540; font-size: 12px;
      }
    </style>
    <script>
      (() => {
        const showBootError = (message) => {
          const panel = document.getElementById('stockmain-boot-fallback');
          if (!panel) return;
          const detail = panel.querySelector('[data-error]');
          panel.querySelector('[data-title]').textContent = 'Não foi possível iniciar o StockMain';
          panel.querySelector('[data-description]').textContent = 'O navegador não conseguiu carregar a interface. Recarregue a página. Se o erro persistir, envie esta mensagem:';
          detail.hidden = false;
          detail.textContent = String(message || 'Falha desconhecida ao carregar os arquivos da aplicação.').slice(0, 1200);
        };
        window.addEventListener('error', (event) => {
          if (event.target && event.target.tagName === 'SCRIPT') {
            showBootError('Falha ao carregar o arquivo JavaScript: ' + (event.target.src || 'arquivo desconhecido'));
          } else if (event.message) {
            showBootError(event.message);
          }
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          showBootError(event.reason && event.reason.message ? event.reason.message : event.reason);
        });
        window.setTimeout(() => {
          if (document.getElementById('stockmain-boot-fallback')) {
            showBootError('A interface não foi inicializada em 12 segundos. Verifique se os arquivos JavaScript foram carregados e se extensões do navegador não os bloquearam.');
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="stockmain-boot-fallback" role="status" aria-live="polite">
      <section>
        <strong>StockMain</strong>
        <h1 data-title>Carregando o sistema...</h1>
        <p data-description>Aguarde enquanto preparamos sua área de trabalho.</p>
        <pre data-error hidden></pre>
      </section>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
